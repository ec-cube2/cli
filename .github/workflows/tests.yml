name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Structure (PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.2', symfony: '4.4' }
          - { php: '7.2', symfony: '5.4' }
          - { php: '7.4', symfony: '4.4' }
          - { php: '7.4', symfony: '5.4' }
          - { php: '8.1', symfony: '5.4' }
          - { php: '8.4', symfony: '5.4' }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies (Symfony ${{ matrix.symfony }})
        env:
          SYMFONY: ${{ matrix.symfony }}
          # Symfony 4.4 は EOL で未修正のセキュリティアドバイザリがあり、Composer 2.9 以降はインストールを拒否する。
          # composer.json がサポート対象としているバージョンの互換性を確認するためだけに、このジョブでは拒否を解除する。
          COMPOSER_NO_SECURITY_BLOCKING: ${{ matrix.symfony == '4.4' && '1' || '' }}
        run: |
          composer update --no-interaction --no-progress \
            --with "symfony/config:${SYMFONY}.*" \
            --with "symfony/console:${SYMFONY}.*" \
            --with "symfony/dependency-injection:${SYMFONY}.*" \
            --with "symfony/event-dispatcher:${SYMFONY}.*" \
            --with "symfony/yaml:${SYMFONY}.*"
          composer show 'symfony/*' phpunit/phpunit

      - name: Run structure tests
        run: vendor/bin/phpunit --testsuite structure

  # 利用者の環境と同じく require-dev なしでインストールしたときに起動できるか
  boot-without-dev:
    name: Boot without require-dev (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies (--no-dev)
        run: |
          composer update --no-interaction --no-progress --no-dev
          composer show

      - name: Run bin/eccube list
        run: php bin/eccube list

  integration:
    name: Integration (PHP ${{ matrix.php }} / ${{ matrix.db }} / EC-CUBE ${{ matrix.eccube }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.4']
        db: [pgsql, mysql]
        eccube: [eccube-2.25.0]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eccube_db
          POSTGRES_USER: eccube_db_user
          POSTGRES_PASSWORD: password
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U eccube_db_user"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: eccube_db
          MYSQL_USER: eccube_db_user
          MYSQL_PASSWORD: password
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ECCUBE_REF: ${{ matrix.eccube }}
      DBSERVER: 127.0.0.1
      DBPORT: ${{ matrix.db == 'pgsql' && '15432' || '13306' }}
      DBNAME: eccube_db
      DBUSER: eccube_db_user
      DBPASS: password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd, pgsql, mysqli, zip, xml
          coverage: none
          tools: composer:v2

      - name: Install test dependencies
        run: composer update --no-interaction --no-progress

      - name: Setup EC-CUBE with ec-cube2/cli
        env:
          DB_TYPE: ${{ matrix.db }}
        run: .github/scripts/setup-eccube.sh "$DB_TYPE"

      - name: Run integration tests
        run: vendor/bin/phpunit --testsuite integration --testdox-text build/testdox.txt

      - name: Write test summary
        if: always()
        env:
          TITLE: PHP ${{ matrix.php }} / ${{ matrix.db }} / ${{ matrix.eccube }}
        run: |
          if [ -f build/testdox.txt ]; then
            {
              echo "### Integration: ${TITLE}"
              echo
              echo '```'
              cat build/testdox.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload EC-CUBE logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eccube-logs-php${{ matrix.php }}-${{ matrix.db }}-${{ matrix.eccube }}
          path: build/ec-cube/data/logs
          if-no-files-found: ignore
